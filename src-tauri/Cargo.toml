[package]
name = "rider_store_erp"
version = "0.1.0"
description = "ERP para Taller de Motocicletas"
authors = ["you"]
edition = "2021"

[lib]
# Nombre de la librería que llama main.rs
name = "rider_store_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- NÚCLEO TAURI 2 ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# --- SEGURIDAD Y HASHING ---
argon2 = "0.5"

# --- MOTOR ASÍNCRONO ---
tokio = { version = "1", features = ["full"] }

# --- BASE DE DATOS (PostgreSQL + SQLx) ---
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "macros",
    "json",
] }

# --- TIPOS DE DATOS ENTERPRISE ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- MANEJO DE ERRORES Y ENTORNO ---
thiserror = "1"
dotenvy = "0.15"
